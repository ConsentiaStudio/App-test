   las fechas «‹ HOY ›»). En el ordenador, menú negro a la izquierda; en el móvil, las pestañas abajo. Gráficos en SVG
   dibujados aquí mismo (no se carga nada de fuera). */
:root{--ink:#111113;--pink:#ff2b91;--pinkD:#c2006b;--pinkS:#ffe3f0;--muted:#6b6b72;--line:#ececef;--line2:#f1f1f3;--bg:#f6f6f8;--card:#fff;--field:#f5f5f7;--line3:#d4d4da;--ink2:#3f3f46;--solid:#111113;--grid:#ececef;color-scheme:light;
  --good:#1d7a43;--goodS:#e4f3e8;--warn:#8a5a00;--warnS:#fdf1d3;--bad:#a20f3b;--badS:#fbe3ea}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.msg{padding:10px 12px;border-radius:8px;margin:0 0 14px;font-size:14px}.msg.bad{background:var(--badS);color:var(--bad)}.msg.ok{background:var(--goodS);color:var(--good)}.msg.warn{background:var(--warnS);color:var(--warn)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}

/* ---------- el aviso si esta página no se puede abrir (4.7.8: fuera lo que quedaba de la entrada del panel antiguo) ---------- */
.lwrap{position:relative;z-index:1;min-height:100%;display:grid;grid-template-columns:minmax(0,440px);justify-content:center;align-content:center;padding:40px 18px}
.lcard{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:44px 44px 34px;box-shadow:0 1px 0 rgba(17,17,19,.03),0 28px 60px -34px rgba(17,17,19,.28)}
@media (max-width:560px){
  .lwrap{min-height:auto;padding:24px 16px 40px;align-content:start}
  .lcard{padding:30px 22px 26px;border-radius:14px}
}

/* ---------- el panel: en el móvil, cabecera negra + pestañas abajo; en el ordenador, menú negro a la izquierda ---------- */
.side .brand,.side .grp,.side .foot{display:none}
.mtop{position:sticky;top:0;z-index:6;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}

.mtop button svg{width:17px;height:17px}
.days{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(49px + env(safe-area-inset-top));z-index:5}
.days button{background:var(--card);color:var(--ink);border:1px solid var(--line3);border-radius:2px;min-width:38px;height:38px;font-size:18px;line-height:1;padding:0}

.days .hoy{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:0 12px}
.days .d{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;font-weight:800;text-align:left;position:relative}
.days .d span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days .d input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.days .upd{display:none;font-size:12px;color:var(--muted);white-space:nowrap}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:1240px;margin:0 auto}
.tabsNav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabsNav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}

.tabsNav button .l2{display:none}
/* (4.2.0) Dentro de la app del móvil (numeros.html, pestaña «Números»): sin cabecera ni «Salir» (los pone la app) y con
   las pestañas arriba, en cualquier ancho. */
body.embed .mtop{display:none}
body.embed .tabsNav{position:static;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:0;border-bottom:1px solid var(--line);padding:6px 4px;height:58px;align-items:stretch}

body.embed .tabsNav button svg.i{width:20px;height:20px;stroke-width:1.7}
body.embed .tabsNav button.on{color:var(--pink)}
body.embed .days{top:0}
body.embed main{padding-bottom:calc(104px + env(safe-area-inset-bottom))} /* (4.7.6) lo que tapa la barra de abajo de la app */

.tile{border-radius:16px;padding:12px 13px;min-width:0;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--ink)}
html[data-theme=oscuro] .tile{background:color-mix(in srgb,var(--c) 24%,#141418)}
.tile>span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}.tile>span i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tile strong{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile strong span{font:inherit}
.tile small{display:block;font-size:11.5px;opacity:.78;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols2{display:grid;gap:12px}.cols2>div{display:grid;gap:12px;align-content:start;min-width:0}
.payB{display:grid;gap:9px}.payB>div{display:flex;align-items:center;gap:10px;font-size:13px}.payB span{width:68px;flex:none}.payB b{width:42px;text-align:right}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px}
.cajaBad{display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 12px;margin-bottom:10px;background:color-mix(in srgb,#e5484d 12%,var(--card));border:1.5px solid #e5484d;color:#c62a30;font-size:13px;font-weight:700}
html[data-theme=oscuro] .cajaBad{color:#ff8f93;background:color-mix(in srgb,#e5484d 22%,#141418)}
.cajaBad>b{flex:none;width:22px;height:22px;border-radius:50%;background:#e5484d;color:#fff;display:grid;place-items:center;font-weight:900}
.cajaBad.big strong{display:block;font-size:14px}.cajaBad.big small{display:block;font-weight:500;color:var(--ink2);font-size:12px;margin-top:1px}
.cajaOk{display:flex;gap:8px;border-radius:14px;padding:9px 12px;margin-bottom:10px;background:var(--goodS);color:var(--good);font-size:12.5px;font-weight:700}
.cajaNo{border-radius:14px;padding:9px 12px;margin-bottom:10px;background:var(--field);color:var(--muted);font-size:12.5px}
.rank{display:flex;flex-direction:column}.rk{display:flex;align-items:center;gap:8px;padding:7px 0;border:0;background:none;text-align:left;width:100%;font-size:13px}
.rk .n{width:16px;color:var(--muted);font-size:12px}.rk .dot{margin:0}.rk .nm{width:96px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .rb{flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}.rk .rb i{display:block;height:100%;border-radius:99px}.rk .v{width:68px;text-align:right}
.rdot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:#e5484d}
.seeAll{display:block;width:100%;margin-top:10px;height:42px;border:1px solid var(--line3);border-radius:12px;background:var(--card);font-weight:800;font-size:13.5px}
.locBar{display:flex;gap:8px;margin:0 -12px 12px;padding:0 12px}
.locAll{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:800}.locAll svg{width:16px;height:16px}.locAll .w{display:none}
.locRow{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:30px}
.locRow::-webkit-scrollbar{display:none}
.locChip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:14px;font-weight:800;white-space:nowrap}
.locChip .dot{margin:0;background:var(--c)}.locChip.on{border:2px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.objBar{position:relative;overflow:visible}.objBar>i{border-radius:99px}.objBar>b{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--ink)}
.chart .ln,.ch small .ln{display:inline-block;width:14px;border-top:2px solid #a20f3b;vertical-align:3px;margin-right:5px}
.locSheet{width:440px;max-height:80vh;overflow:auto;padding:16px}
@media (min-width:600px){.locSheet{top:8vh}}
@media (max-width:599px){.locSheet{width:auto;max-height:86vh;overflow:auto}}
.lsQ{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--field);padding:0 12px;margin:4px 0 6px}.lsQ input{flex:1;border:0;background:transparent;outline:0;font-size:15px;min-width:0}.lsQ svg{width:17px;height:17px;color:var(--muted)}
.lsH{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}.lsH.bad{color:#e5484d}
.lsR{display:flex;align-items:center;gap:10px;width:100%;padding:10px 2px;border:0;border-top:1px solid var(--line2);background:none;text-align:left}.lsR .dot{margin:0}.lsR.on{background:var(--field)}
.lsN{flex:1;min-width:0}.lsN b{display:block;font-size:14.5px}.lsN small{font-size:11.5px;font-weight:800;color:var(--muted)}.lsN small.ok{color:var(--good)}.lsN small.bad{color:#e5484d}
.eqN{width:16px;flex:none;color:var(--muted);font-size:12px;align-self:center}.eqAv{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--c)}

.eqM .eqBar{position:relative;width:auto;height:6px}.eqM .eqBar i{background:var(--ink)}.eqM .eqBar b{border-left:2px solid var(--pink)}
.bigLine{font-size:22px;font-weight:800;line-height:1.25;margin:2px 2px 12px;letter-spacing:-.01em}.bigLine .neg{color:#e5484d}.bigLine .pos{color:var(--good)}
.frs{padding:0 14px;margin-bottom:12px}.fr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}.fr:first-child{border-top:0}
.frI{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);font-weight:900}.frI svg{width:18px;height:18px}
.frT{flex:1;min-width:0}.frT b{display:block;font-size:13.5px}.frT small{display:block;font-size:12px;color:var(--muted)}.frV{font-size:16px;white-space:nowrap}.frV.pedir{background:none;color:var(--ink);padding:0;font-size:15px;letter-spacing:0}
.soft{background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:transparent}html[data-theme=oscuro] .soft{background:color-mix(in srgb,var(--c) 22%,#141418)}.soft .appL>div{border-color:color-mix(in srgb,var(--c) 20%,transparent)}
/* pantalla grande (tablet u ordenador): dos columnas y, a partir de 1000 px, las secciones a la izquierda */
@media (min-width:900px){
  .cols2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .locFicha .cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .locAll .w{display:inline}
  .bigLine{font-size:26px}
}
@media (min-width:1000px){
  body.dash.embed #app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
  body.embed .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#111113;color:#fff;padding:22px 14px 16px}
  body.embed .side .brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;border-bottom:1px solid #2a2a30}
  body.embed .side .brand img{width:30px;height:30px;filter:invert(1)}
  body.embed .side .brand b{display:block;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
  body.embed .side .brand small{display:block;color:#9b9aa3;font-size:11px;margin-top:2px}
  body.embed .side .grp{display:block;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#9b9aa3;padding:18px 10px 8px}
  body.embed .tabsNav{display:flex;flex-direction:column;gap:4px;height:auto;padding:0;background:none;border:0;overflow:visible}
  body.embed .tabsNav button{width:100%;height:42px;justify-content:flex-start;padding:0 12px;border:0;border-radius:10px;background:none;color:#d9d7d2;gap:10px;font-size:14px}
  body.embed .tabsNav button svg.i{width:18px;height:18px}
  body.embed .tabsNav button .l1{display:inline}
  body.embed .tabsNav button.on{flex:none;width:100%;padding:0 12px;background:var(--pink);color:#fff}
  body.embed .side .foot{display:none}
  body.embed .days{padding:16px 28px 6px}
  body.embed main{padding:12px 28px calc(104px + env(safe-area-inset-bottom));max-width:1400px}
}

#c12{cursor:pointer}
@media (max-width:999px){

  body.embed.scrolled .days{box-shadow:0 12px 18px -16px rgba(17,17,19,.45)}
}

.rv.in{opacity:1;transform:none}

.rv.in .pbar i,.rv.in .rb i,.rv.in .svL i,.rv.in .objBar>i,.rv.in .eqBar i{transform:none}
main.inR{animation:inR .38s cubic-bezier(.2,.9,.3,1)}main.inL{animation:inL .38s cubic-bezier(.2,.9,.3,1)}

        '<div class="calG">' + ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(function (w) { return '<span class="calW">' + w + '</span>'; }).join('') + cells + '</div><div class="calF"><button type="button" class="calHoy" data-k="' + t + '">Hoy</button><small>Elige un día para ver sus cifras.</small></div>';
    };
    paint(); document.body.appendChild(back); document.body.appendChild(box);
    var r = btn.getBoundingClientRect(); box.style.top = (r.bottom + 6) + 'px'; box.style.left = Math.max(8, Math.min(innerWidth - 328, r.left)) + 'px';
    back.onclick = closeCal;
    box.onclick = function (e) { var m = e.target.closest('[data-m]'); if (m && !m.disabled) { var d0 = new Date(+cur.slice(0, 4), +cur.slice(5, 7) - 1 + Number(m.dataset.m), 1); cur = d0.getFullYear() + '-' + pad(d0.getMonth() + 1); paint(); return; }
      var k = e.target.closest('[data-k]'); if (k && !k.disabled) { closeCal(); if (k.dataset.k !== st.day) { st.day = k.dataset.k; load(); } } };
    document.addEventListener('keydown', calKey);
  }
  function calKey(e) { if (e.key === 'Escape') closeCal(); }
  function closeCal() { ['calBack', 'calBox'].forEach(function (id) { var n = document.getElementById(id); if (n) n.remove(); }); document.removeEventListener('keydown', calKey); }

  /* ---------------- arranque ---------------- */
  var rz; addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { var dd = (st.data || []).filter(function (x) { return x.dia || x.mes; }), c = document.getElementById('cols'), c12 = document.getElementById('c12'); if (c && st.data) columns(c, dd, false, { mono: true }); if (c12 && st.data) draw12(c12, dd); [c, c12].forEach(function (el) { if (el) el.querySelectorAll('.b').forEach(function (b) { b.style.transition = 'none'; b.style.transform = 'none'; }); }); }, 200); });
  // (4.7.8) Al bajar, las pestañas y el «‹ día ›» se quedan arriba (con una sombra suave).
  addEventListener('scroll', function () { document.body.classList.toggle('scrolled', scrollY > 8); }, { passive: true });
  if (!C) { app.innerHTML = '<div class="lwrap"><div class="lcard"><div class="msg bad">Este navegador no puede descifrar (hace falta https y un navegador actual).</div></div></div>'; return; }
  if (!cfg.repo) { app.innerHTML = '<div class="lwrap"><div class="lcard"><div class="msg bad">Esta página solo funciona desde su dirección de GitHub Pages.</div></div></div>'; return; }
  // (4.2.0) Dentro de la app: espera la clave de ese móvil y sus locales (de la propia app, misma dirección).
  document.body.classList.add('embed');
  app.innerHTML = '<main><div class="card"><p class="loading">' + (window.parent !== window ? 'Abriendo los números…' : 'Los números se ven dentro de la app.') + '</p></div></main>';
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.t !== 'cs-numeros' || typeof e.data.kid !== 'string' || !e.data.key || e.data.key.type !== 'private') return;
    st.me = { kid: e.data.kid, id: e.data.kid, key: e.data.key }; st.zonas = Array.isArray(e.data.zonas) ? e.data.zonas.slice(0, 100).map(String) : []; st.files = {}; st.open = {}; load();
  });
})();
</script>
