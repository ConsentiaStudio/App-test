<title>Pide tu cita</title>
<style>
:root{--pink:#ff2b91;--ink:#111113;--mute:#6b6b72;--line:#ececef;--bg:#ffffff;--ok:#1d8a4a;--warn:#9a6400;--bad:#c62828;--soft:#fff0f7;--card:#ffffff;--field:#f5f5f7;--bar:rgba(255,255,255,.94);--solid:#111113;--line2:#f1f1f3;color-scheme:light}
html[data-theme=oscuro]{--ink:#f4f2ee;--mute:#9b9aa3;--line:#26262c;--bg:#0e0e11;--ok:#4cc38a;--warn:#ffd98a;--bad:#ff8fa3;--soft:rgba(255,43,145,.16);--card:#18181c;--field:#1d1d22;--bar:rgba(18,18,21,.94);--solid:#ff2b91;--line2:#222228;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font-family:inherit}
/* (4.5.1) Como la app de la agenda: barra de arriba con el logotipo, contenido y la barra de abajo («Mis citas» · «Pedir cita») */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(17,17,19,.08)}
.top img{width:30px;height:30px;flex:none}
.top .t{min-width:0}.top b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
.modes{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid rgba(17,17,19,.12)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.modes{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}}
.modes .seg{display:flex;gap:2px;max-width:520px;margin:0 auto;padding:3px;border-radius:14px;background:rgba(118,118,128,.16)}
.modes button{flex:1 1 0;min-width:0;height:46px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;background:transparent;color:var(--mute);font-size:15px;font-weight:650;position:relative}
.modes button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modes button.on{background:var(--card);color:var(--ink);box-shadow:0 3px 8px rgba(17,17,19,.12),0 1px 1px rgba(17,17,19,.08)}
.modes .dot{position:absolute;top:7px;right:calc(50% - 52px);min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(17,17,19,.04)}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 2px 4px}.lead{color:var(--mute);margin:0 2px 14px;font-size:14.5px}
h2{font-size:17px;margin:0 0 8px;letter-spacing:-.01em}h3{font-size:12px;margin:16px 2px 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
.hint{color:var(--mute);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* pasos */

/* locales */
.loc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--ink)}
.loc .ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}.loc .ic svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.loc b{display:block;font-size:16px}.loc small{color:var(--mute)}.loc.on{border-color:var(--pink);background:var(--soft)}.loc .ck{margin-left:auto}
/* servicios */

.sv{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin:0 0 8px;font-weight:400;cursor:pointer}
.sv input{position:absolute;opacity:0;pointer-events:none}
.sv .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900}
.sv.on{border-color:var(--pink);background:var(--soft)}.sv.on .ck{background:var(--pink);border-color:var(--pink)}
.sv .n{flex:1;font-weight:600;line-height:1.25}.sv .m{color:var(--mute);font-size:13px;white-space:nowrap;text-align:right}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900}.on>.ck{background:var(--pink);border-color:var(--pink)}
/* cuándo */
.who{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.who::-webkit-scrollbar{display:none}
.wh{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;border:0;background:none;color:var(--ink);font-size:13px;font-weight:650}
.wh .av{width:52px;height:52px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:19px;font-weight:800}
.wh.on .av{border-color:var(--pink);background:var(--pink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;scroll-snap-type:x proximity}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;width:64px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.chip small{font-size:11.5px;color:var(--mute);font-weight:700;text-transform:capitalize}.chip b{font-size:21px;line-height:1.1}.chip em{font-style:normal;font-size:10.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.chip.on{background:var(--solid);border-color:var(--solid);color:#fff}.chip.on small,.chip.on em{color:#ddd}
.chip.off{background:transparent;border-style:dashed;color:#b3ada4}.chip.off small,.chip.off em{color:#b3ada4}
.month{font-weight:800;font-size:15px;margin:4px 2px 8px}
.part{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--mute);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.06em}.part svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 0;font-size:15px;font-weight:700;color:var(--ink)}.slot.on{background:var(--pink);border-color:var(--pink);color:#fff}
/* datos */
label{display:block;font-weight:650;font-size:14px;margin:12px 2px 6px}
input[type=text],input[type=tel],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--pink)}
textarea{min-height:76px;resize:vertical}
.resume{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}.resume span{color:var(--mute)}.resume b{font-weight:650}
button.p{border:0;background:var(--pink);color:#fff;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:750;width:100%}
button.p:disabled{opacity:.45}
button.s{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:650}
button.s.bad{color:var(--bad);border-color:var(--bad)} /* (4.7.4) que se vea */
button.lnk{border:0;background:none;color:var(--mute);font-size:14px;font-weight:650;padding:8px 2px}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:750;background:#eee;color:#555}
.tag.ok{background:#e4f6ea;color:var(--ok)}.tag.warn{background:#fff1d6;color:var(--warn)}.tag.bad{background:#fde7e7;color:var(--bad)}.tag.info{background:#e4eefc;color:#1d5fb4}
.msg{border-radius:14px;padding:11px 13px;margin:8px 0;font-size:14px;background:#eef2fb;color:#1d3a6b}
.msg.warn{background:#fff6e0;color:#6b4a00}.msg.bad{background:#fde7e7;color:#8a1c1c}.msg.ok{background:#e4f6ea;color:#14532d}
.sum{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:8;display:flex;gap:10px;align-items:center;max-width:560px;margin:0 auto;padding:10px 14px}
.sum .in{flex:1;display:flex;gap:10px;align-items:center;background:var(--solid);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 8px 24px rgba(17,17,19,.25)}
.sum b{flex:1;font-size:14px;line-height:1.25}.sum button.p{width:auto;padding:12px 18px}
.sum button.bk{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:12px 12px;font-size:15px;font-weight:700}
.photo{max-width:100%;max-height:200px;border-radius:12px;display:block;margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:14px 2px}.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--pink);flex:none}
.full{text-align:center;padding:24px 16px}.full .ic{font-size:40px;line-height:1}.full h2{font-size:19px;margin:10px 0 6px}
a.tel{display:block;margin-top:14px;text-decoration:none;text-align:center;border-radius:14px;padding:14px 18px;background:var(--pink);color:#fff;font-size:17px;font-weight:750}
.empty{text-align:center;padding:26px 18px}.empty .ic{width:56px;height:56px;margin:0 auto 10px;border-radius:18px;background:var(--soft);display:grid;place-items:center}.empty .ic svg{width:28px;height:28px;fill:none;stroke:var(--pink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.titleRow{display:flex;align-items:center;gap:8px;margin:2px 0 4px}.titleRow h1{margin:4px 0}
.refresh{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}.refresh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.refresh.spin svg{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loc.off{opacity:.5}.loc:disabled{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.telRow{display:flex;gap:8px}.telRow #prefijo{flex:0 0 76px;text-align:center;font-weight:700}.telRow #telefono{flex:1;min-width:0}
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(118,118,128,.16);margin:6px 0 12px}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:13px;font-weight:650;color:var(--mute);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:750;box-shadow:0 2px 6px rgba(17,17,19,.12)}
/* (4.6.1) el número, separado del texto y a la derecha, en una pastilla */
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 4px}
.tabs button b{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;font-size:11.5px;line-height:1}.tabs .n-ok{color:var(--ok);background:#e4f6ea}.tabs .n-warn{color:var(--warn);background:#fff1d6}
.ap .d.ok{background:#e4f6ea}.ap .d.ok small{color:var(--ok)}.ap .d.warn{background:#fff1d6}.ap .d.warn small{color:var(--warn)}.ap .d.gone{background:var(--field)}.ap .d.gone small{color:var(--mute)}
.card.past,.card.gone{background:var(--field);color:var(--mute)}.card.gone .sv-t{text-decoration:line-through}
.when{font-size:12.5px;font-weight:700;margin-top:6px;color:var(--mute)}.when.soon{color:var(--ok)}
.prop{border:2px solid #6d3fd8;box-shadow:0 10px 26px rgba(109,63,216,.15)}
.pp{display:flex;gap:12px;align-items:center;margin:14px 0}.pp>div{flex:1;text-align:center;border-radius:14px;padding:10px}.pp small{display:block;font-size:11px;font-weight:800}
.pp .was{background:var(--bg);color:var(--mute)}.pp .was s{font-size:15px}.pp .new{background:#f1ebff;color:#3b1a8f}.pp .new b{font-size:17px}.pp .ar{flex:none;font-size:20px;color:#6d3fd8}
.tag.vio{background:#f1ebff;color:#4b22a8}
.ap{display:flex;gap:12px;align-items:flex-start}.ap .d{flex:none;width:52px;border-radius:14px;background:var(--bg);text-align:center;padding:6px 0}.ap .d small{display:block;font-size:11px;font-weight:800;color:var(--pink);text-transform:uppercase}.ap .d b{display:block;font-size:20px;line-height:1.1}.ap .x{flex:1;min-width:0}

/* ===================== (4.7.1) Como la app del equipo: claro (de fábrica) u oscuro, pasos en flecha, servicios en índice ===================== */
.top{border-bottom-color:var(--line)}.top .tb{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.top .tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
html[data-theme=oscuro] .top img{filter:invert(1)}
.card{background:var(--card);border-color:var(--line);box-shadow:none}
.stpr{display:flex;margin:2px 0 10px}
.stpr span{flex:1;min-width:0;height:34px;margin-left:-6px;padding:0 4px 0 12px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:750;white-space:nowrap;background:var(--field);color:var(--mute);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.stpr span:first-child{margin-left:0;padding-left:4px;border-radius:10px 0 0 10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.stpr span:last-child{border-radius:0 10px 10px 0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%)}
.stpr span.on{background:var(--pink);color:#fff}.stpr span.done{background:var(--soft);color:var(--pink)}
.grp{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;margin:0 0 8px;font-size:15.5px;font-weight:750}
.grp .gn{flex:1}.grp small{color:var(--mute);font-size:12px;font-weight:600}.grp i{min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 5px}
.grp svg{width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg)}.grp.on svg{transform:none}
.grp.on{margin-bottom:0;border-radius:14px 14px 0 0;border-bottom-color:var(--line2)}
.grpB{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;background:var(--field);margin-bottom:8px}
.grpB .sv{margin:0;border:0;border-radius:0;border-top:1px solid var(--line2);background:transparent;padding:12px 14px 12px 20px}.grpB .sv:first-child{border-top:0}.grpB .sv.on{background:var(--soft)}
.again{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--pink);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.again .x{flex:1;min-width:0}.again b{display:block;font-size:14.5px}.again small{display:block;color:var(--mute);font-size:12.5px}
.again button{flex:none;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:800;font-size:14px;padding:10px 14px}
.telOk{font-size:12.5px;font-weight:800;color:var(--ok);margin:6px 2px 0;min-height:16px}
.hero{background:var(--solid);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.hero .hk{display:flex;align-items:center;gap:8px}.hero .hk small{flex:1;font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.8}.hero .hk span{font-size:11px;font-weight:800;color:#1d8a4a;background:#fff;border-radius:999px;padding:3px 9px}
.hero .hd{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.02em;text-transform:capitalize}.hero .hh{font-size:17px;font-weight:700;opacity:.9}.hero .hs{margin-top:10px;font-size:14px}.hero .hw{font-size:13px;opacity:.8}
.hero .hb{display:flex;gap:8px;margin-top:14px}.hero .hb a,.hero .hb button{flex:1;height:42px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;border:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:750;text-decoration:none}
.hero .hb svg,.cb svg,.calB svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero .hb{flex-wrap:wrap}.hero .hb>a,.hero .hb>button{flex:1 1 40%;min-width:0;white-space:nowrap;padding:0 8px}.hero .hb .calB svg{width:16px;height:16px;flex:none}.hero .hb .calB{margin:0;height:42px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;border:0;justify-content:center;font-size:12.5px;font-weight:750;padding:0 6px;gap:5px}
.hero ul.hl{margin:10px 0 0;padding-left:20px;font-size:13.5px}.hero ul.hl li{margin:2px 0;opacity:.85}.hero ul.hl li.hs{margin-top:0;font-size:14.5px;font-weight:700;opacity:1}
.hero button.anula{display:block;width:100%;height:44px;margin-top:10px;border:0;border-radius:12px;background:#fff;color:#d0103f;font-size:14.5px;font-weight:800}
ul.cl{margin:2px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}ul.cl li{margin:1px 0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);margin:14px 2px 8px}
.calB{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;margin:0 0 10px;background:var(--soft);border:1px solid var(--pink);font-size:14px}
.aviso b{display:block}.aviso button{margin-left:auto;flex:none;border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:0 2px}
.okBox{text-align:center;padding:22px 16px}.okBox .ck2{width:76px;height:76px;border-radius:50%;background:#e4f6ea;display:grid;place-items:center;margin:0 auto;color:#1d8a4a;font-size:38px;font-weight:900}
.okBox h2{font-size:22px;margin:12px 0 4px}.okBox .resume{text-align:left;margin-top:14px}
.ctr{display:flex;align-items:center;gap:10px}.ctr .ci{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--pink);display:grid;place-items:center;flex:none}.ctr .ci svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ctr b{display:block}.ctr small{display:block;color:var(--mute);font-size:12.5px}
.cb{display:flex;gap:8px;margin-top:12px}.cb a{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:750}
/* Mis citas: las pestañas con icono; la elegida, en rosa con su nombre */
.tabs{background:transparent;padding:0;gap:6px;margin:6px 0 12px}
.tabs button{flex:none;width:48px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0;position:relative;box-shadow:none}
.tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs button .tl{display:none}
.tabs button.on{flex:1 1 auto;width:auto;background:var(--pink);border-color:var(--pink);color:#fff;padding:0 14px;box-shadow:none}.tabs button.on .tl{display:inline}
.tabs button b{position:absolute;top:-4px;right:-4px}.tabs button.on b{position:static}
.tabs .n-ok,.tabs .n-warn{background:#ffc21a;color:#3a2a00}

.shBack{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sh{width:100%;max-width:560px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sh::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh h2{margin:0 0 10px}.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--ink);padding:12px 4px;text-align:left;font-size:15px;font-weight:650}.opt:first-of-type{border-top:0}
.opt i{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}.opt.on i{border:7px solid var(--pink)}
.inst{text-align:center}.inst .ii{width:72px;height:72px;border-radius:18px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18);display:grid;place-items:center;margin:0 auto}.inst .ii img{width:54px;height:54px}
.inst h2{margin:12px 0 4px}.inst .st{text-align:left;margin-top:8px}.inst .sr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}.inst .sr:first-child{border-top:0}
