<style>
:root{--pink:#ff2b91;--ink:#1c1b1f;--mute:#6f6c76;--line:#e7e4ea;--bg:#faf8fb;--ok:#1d8a4a;--warn:#b07000;--bad:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 80px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
header .c{width:40px;height:40px;border-radius:12px;background:var(--pink);color:#fff;display:grid;place-items:center;font:800 22px Georgia,serif}
header h1{font-size:19px;margin:0;line-height:1.15}header small{color:var(--mute);display:block;font-size:13px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--mute)}
.tabs button.on{background:var(--pink);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.hint{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sv{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.sv:last-child{border:0}.sv input{width:20px;height:20px;accent-color:var(--pink)}.sv .n{flex:1}.sv .m{color:var(--mute);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);text-align:center;min-width:64px}
.chip.on{border-color:var(--pink);background:#fff0f7;color:var(--pink)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots .chip{min-width:0;padding:10px 4px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=tel],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button.p{border:0;background:var(--pink);color:#fff;border-radius:14px;padding:14px 18px;font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;width:100%}
button.p:disabled{opacity:.45}
button.s{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button.s.bad{color:var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font:700 12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eee;color:#555}
.tag.ok{background:#e4f6ea;color:var(--ok)}.tag.warn{background:#fff1d6;color:var(--warn)}.tag.bad{background:#fde7e7;color:var(--bad)}.tag.info{background:#e4eefc;color:#1d5fb4}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;background:#eef2fb;color:#1d3a6b}
.msg.warn{background:#fff6e0;color:#6b4a00}.msg.bad{background:#fde7e7;color:#8a1c1c}.msg.ok{background:#e4f6ea;color:#14532d}
.sum{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin:0 -14px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.sum b{flex:1}.sum button{width:auto;padding:12px 18px}
.photo{max-width:100%;max-height:200px;border-radius:12px;display:block;margin-top:8px}
.big{font:800 20px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:12px 0}.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--pink)}
.full{text-align:center;padding:22px 16px}.full .ic{font-size:40px;line-height:1}.full h2{font-size:19px;margin:10px 0 6px}
a.tel{display:block;margin-top:14px;text-decoration:none;text-align:center;border-radius:14px;padding:14px 18px;background:var(--pink);color:#fff;font:700 17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
input[type=search]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink)}

<body>
<main id="app"></main>
<script>
(function () {
  'use strict';
  var SC = crypto.subtle, TE = new TextEncoder(), TD = new TextDecoder();
  var FMT_ACC = 'consentia-acc-1', FMT_AG2 = 'consentia-agenda-2', FMT_PANEL = 'consentia-panel-1', FMT_C = 'consentia-cita-c1';
  var ECDH = { name: 'ECDH', namedCurve: 'P-256' };
  var ZONE_RE = /^[A-Za-z0-9][A-Za-z0-9-]{0,59}$/, REPO_RE = /^[\w.-]+\/[\w.-]+$/, TOK_RE = /^github_pat_[A-Za-z0-9_]{20,}$/, ID_RE = /^[a-f0-9]{16}$/;
  var PHOTO_MAX = 150000, C_ITER = 300000;

  /* ---------- utilidades ---------- */
  function b64u(buf) { var b = buf instanceof Uint8Array ? buf : new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(t) { t = String(t || '').replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; var s = atob(t), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  function u8(x) { return x instanceof Uint8Array ? x : new Uint8Array(x); }
  function rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function hex(n) { return Array.prototype.map.call(rnd(n), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { var v = attrs[k]; if (v == null || v === false) return; if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.indexOf('on') === 0) e[k] = v; else if (k === 'value') e.value = v; else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v; else e.setAttribute(k, v === true ? '' : v); });
    (kids || []).forEach(function (c) { if (c == null || c === false) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('cs-cita-' + k) || 'null'); if (v === null) localStorage.removeItem('cs-cita-' + k); else localStorage.setItem('cs-cita-' + k, JSON.stringify(v)); } catch (e) { return null; } }
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  function hm(m) { return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60); }
  function mins(s) { return +s.slice(0, 2) * 60 + +s.slice(3, 5); }
  function dayText(d, long) { var p = d.split('-'); var t = new Date(+p[0], +p[1] - 1, +p[2]); var o = long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric', month: 'short' }; try { return t.toLocaleDateString('es-ES', o); } catch (e) { return d; } }
  function durText(m) { var h = Math.floor(m / 60), r = m % 60; return (h ? h + ' h' : '') + (h && r ? ' ' : '') + (r ? r + ' min' : ''); }
  function money(v) { try { return v.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }); } catch (e) { return v + ' €'; } }
  function digits(t) { return String(t || '').replace(/\D/g, ''); }
  function codeNorm(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  // (4.5.0) SHA-256 sin esperas (para la prueba de trabajo: hacen falta muchos seguidos) y la prueba en sí: el ordenador del
  // centro solo recoge las solicitudes que la traen (lib/citas-web.js → powOk). Cuesta un par de segundos en un móvil.
  var K256 = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  var W256 = new Int32Array(64);
  function sha256First(bytes) { // → los 32 primeros bits del SHA-256 (es lo único que mira la prueba)
    var l = bytes.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(bytes); m[l] = 0x80; var bits = l * 8; m[n - 4] = bits >>> 24; m[n - 3] = (bits >>> 16) & 255; m[n - 2] = (bits >>> 8) & 255; m[n - 1] = bits & 255;
    var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19, w = W256;
    for (var o = 0; o < n; o += 64) {
      for (var i = 0; i < 16; i++) w[i] = (m[o + i * 4] << 24) | (m[o + i * 4 + 1] << 16) | (m[o + i * 4 + 2] << 8) | m[o + i * 4 + 3];
      for (i = 16; i < 64; i++) { var x = w[i - 15], y = w[i - 2]; var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3), s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
      for (i = 0; i < 64; i++) { var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7)), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K256[i] + w[i]) | 0, S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10)), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
      h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
    }
    return h0 >>> 0;
  }
  function powFind(base, bits) { // base: «id|at|x|» → el sufijo que hace que el SHA-256 empiece por `bits` ceros
    var lim = bits >= 32 ? 0 : (0xffffffff >>> bits) >>> 0, pre = TE.encode(base), n = 0;
    return new Promise(function (ok) { (function step() { var t0 = Date.now(); while (Date.now() - t0 < 40) { for (var k = 0; k < 500; k++, n++) { var sfx = n.toString(36), b = new Uint8Array(pre.length + sfx.length); b.set(pre); for (var j = 0; j < sfx.length; j++) b[pre.length + j] = sfx.charCodeAt(j); if (sha256First(b) <= lim) return ok(sfx); } } setTimeout(step, 0); })(); });
  }
  async function withPow(obj) { var bits = Math.max(0, Math.min(24, +((S.zdata || {}).pow) || 18)); obj.pow = await powFind(obj.id + '|' + obj.at + '|' + obj.pub.x + '|', bits); return obj; }

  /* ---------- dónde estamos: repositorio de la página, del buzón (Citas), llave y local ---------- */
  var cfg = (function () {
    var h = location.hostname, seg = location.pathname.split('/').filter(Boolean), q = new URLSearchParams(location.search);
    if (/\.github\.io$/i.test(h) && seg.length) return { repo: h.split('.')[0] + '/' + seg[0], api: 'https://api.github.com', raw: 'https://raw.githubusercontent.com' };
    if (h !== 'localhost' && h !== '127.0.0.1') return { repo: '', api: '', raw: '' };
    return { repo: q.get('repo') || '', api: q.get('api') || 'https://api.github.com', raw: q.get('raw') || 'https://raw.githubusercontent.com' };
  })();
  var link = store('link') || {};
  (function () {
    var m = /[#&]k=([^&]+)/.exec(location.hash), z = /[#&]z=([^&]+)/.exec(location.hash), r = /[#&]r=([^&]+)/.exec(location.hash);
    if (m && TOK_RE.test(m[1]) && z && ZONE_RE.test(z[1]) && r && REPO_RE.test(decodeURIComponent(r[1]))) { link = { k: m[1], z: z[1], r: decodeURIComponent(r[1]) }; store('link', link); }
    try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  })();

  var S = { tab: 'pedir', step: 0, z: null, zona: link.z || '', zdata: null, loading: false, err: '', sel: {}, day: '', time: '', emp: '', f: { name: '', phone: '', note: '', consent: false, photo: '' }, busy: false, sent: null, mine: [], cl: null, clMsg: '', clBusy: false };
  var root = document.getElementById('app');

  /* ---------- cifrado (lo mismo que la app del móvil) ---------- */
  async function pubOf(p) { return SC.importKey('jwk', { kty: 'EC', crv: 'P-256', x: p.x, y: p.y, ext: true }, ECDH, false, []); }
  async function kek(fmt, priv, other, saltX, kid) {
    var shared = await SC.deriveBits({ name: 'ECDH', public: await pubOf(other) }, priv, 256);
    var hk = await SC.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    return SC.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: unb64u(saltX), info: TE.encode(fmt + '|' + kid) }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function sealEnv(obj, rcp, zona, file) {
    var eph = await SC.generateKey(ECDH, true, ['deriveBits']), ej = await SC.exportKey('jwk', eph.publicKey);
    var cek = rnd(32), iv = rnd(12), ck = await SC.importKey('raw', cek, 'AES-GCM', false, ['encrypt']);
    var c = await SC.encrypt({ name: 'AES-GCM', iv: iv, additionalData: TE.encode(FMT_ACC + ':' + zona + '/' + file) }, ck, TE.encode(JSON.stringify(obj)));
    var k = await kek(FMT_ACC, eph.privateKey, { x: rcp.x, y: rcp.y }, ej.x, rcp.kid), wiv = rnd(12);
    var w = await SC.encrypt({ name: 'AES-GCM', iv: wiv, additionalData: TE.encode(rcp.kid) }, k, cek);
    var wb = new Uint8Array(12 + w.byteLength); wb.set(wiv, 0); wb.set(u8(w), 12);
    return JSON.stringify({ f: FMT_ACC, z: zona, n: file, epk: { x: ej.x, y: ej.y }, r: [{ k: rcp.kid, w: b64u(wb) }], iv: b64u(iv), c: b64u(c) });
  }
  async function openEnv(e, kid, priv) {
    if (typeof e === 'string') e = JSON.parse(e);
    if (!e || [FMT_ACC, FMT_AG2, FMT_PANEL].indexOf(e.f) < 0 || !e.epk) throw new Error('formato');
    var mine = (e.r || []).filter(function (r) { return r && r.k === kid; })[0]; if (!mine) throw new Error('sin-mi');
    var k = await kek(e.f, priv, e.epk, e.epk.x, kid), w = unb64u(mine.w);
    var cek = await SC.decrypt({ name: 'AES-GCM', iv: w.slice(0, 12), additionalData: TE.encode(kid) }, k, w.slice(12));
    var ck = await SC.importKey('raw', cek, 'AES-GCM', false, ['decrypt']);
    var plain = await SC.decrypt({ name: 'AES-GCM', iv: unb64u(e.iv), additionalData: TE.encode(e.f + ':' + e.z + '/' + e.n) }, ck, unb64u(e.c));
    return JSON.parse(TD.decode(plain));
  }
  // La clienta con su teléfono y su código: PBKDF2 → nombre del archivo + clave (lib/citas-web.js → clientKeys)
  async function clientKeys(phone, code) {
    var base = await SC.importKey('raw', TE.encode(digits(phone).slice(-9) + '|' + codeNorm(code)), 'PBKDF2', false, ['deriveBits']);
    var bits = u8(await SC.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: TE.encode('consentia-cita-1'), iterations: C_ITER }, base, 352));
    return { name: 'c-' + b64u(bits.slice(0, 12)) + '.json', key: await SC.importKey('raw', bits.slice(12), 'AES-GCM', false, ['decrypt']) };
  }
  async function openClient(text, keys) {
    var e = typeof text === 'string' ? JSON.parse(text) : text; if (!e || e.f !== FMT_C) throw new Error('formato');
    var p = await SC.decrypt({ name: 'AES-GCM', iv: unb64u(e.iv), additionalData: TE.encode(FMT_C) }, keys.key, unb64u(e.c));
    return JSON.parse(TD.decode(p));
  }
  // La llave de ESTE móvil (solo para leer las respuestas a SUS solicitudes): se crea la primera vez que pide algo.
  async function device() {
    var d = store('dev');
    if (!d) { var kp = await SC.generateKey(ECDH, true, ['deriveBits']), j = await SC.exportKey('jwk', kp.privateKey); d = { x: j.x, y: j.y, d: j.d }; store('dev', d); }
    return d;
  }
  function devPriv(d) { return SC.importKey('jwk', { kty: 'EC', crv: 'P-256', x: d.x, y: d.y, d: d.d, ext: false }, ECDH, false, ['deriveBits']); }

  /* ---------- GitHub ---------- */
  async function getJson(url) {
    var r; try { r = await fetch(url, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }); } catch (e) { throw new Error('Sin conexión (¿hay Internet?).'); }
    if (r.status === 404) return null; if (!r.ok) throw new Error('No se ha podido leer (' + r.status + ').');
    return r.json();
  }
  function rawUrl(zona, path, every) { return cfg.raw + '/' + cfg.repo + '/cs-cita-' + zona + '/' + path + '?t=' + Math.floor(Date.now() / (every || 15000)); }
  async function putRequest(id, env) {
    var body = JSON.stringify({ message: 'Consentia Studio', content: btoa(JSON.stringify({ v: 1, env: env })), branch: 'main' });
    var r; try { r = await fetch(cfg.api + '/repos/' + link.r + '/contents/p/' + id + '.json', { method: 'PUT', credentials: 'omit', referrerPolicy: 'no-referrer', headers: { Authorization: 'Bearer ' + link.k, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' }, body: body }); }
    catch (e) { throw new Error('Sin conexión (¿hay Internet?).'); }
    if (r.status === 401 || r.status === 403) throw new Error('Este enlace ya no vale. Pide uno nuevo al centro.');
    if (r.status === 404) throw new Error('El centro todavía no ha preparado las citas por internet.');
    if (r.status === 422) throw new Error('Esa solicitud ya estaba enviada.');
    if (!r.ok) throw new Error('GitHub respondió ' + r.status + '. Inténtalo en un momento.');
  }
  async function send(obj) { // obj: lo de dentro (ya con id, kind, at, pub)
    var z = S.zdata; if (!z || !z.pk) throw new Error('El centro todavía no tiene las citas listas.');
    var env = await sealEnv(obj, { kid: 'accesos', x: z.pk.x, y: z.pk.y }, '-', 'cita');
    if (env.length > 255000) throw new Error('La foto pesa demasiado: quítala o prueba con otra.');
    await putRequest(obj.id, env);
  }

  // (4.5.0) z.json recién leído (con la API y la llave del enlace, que no tiene la caché de raw); si falla, de raw.
