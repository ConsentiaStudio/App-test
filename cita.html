<style>
:root{--pink:#ff2b91;--ink:#111113;--mute:#77736c;--line:#e4e0d8;--bg:#f4f2ee;--ok:#1d8a4a;--warn:#9a6400;--bad:#c62828;--soft:#fff0f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font-family:inherit}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(244,242,238,.92);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(17,17,19,.08)}
.top img{width:30px;height:30px;flex:none}
.top .t{min-width:0}.top b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
.modes{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#f7f6f3;border-top:1px solid rgba(17,17,19,.12)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.modes{background:rgba(247,246,243,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}}
.modes .seg{display:flex;gap:2px;max-width:520px;margin:0 auto;padding:3px;border-radius:14px;background:rgba(118,118,128,.16)}
.modes button{flex:1 1 0;min-width:0;height:46px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;background:transparent;color:#5b5b61;font-size:15px;font-weight:650;position:relative}
.modes button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(17,17,19,.12),0 1px 1px rgba(17,17,19,.08)}
.modes .dot{position:absolute;top:7px;right:calc(50% - 52px);min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(17,17,19,.04)}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 2px 4px}.lead{color:var(--mute);margin:0 2px 14px;font-size:14.5px}
h2{font-size:17px;margin:0 0 8px;letter-spacing:-.01em}h3{font-size:12px;margin:16px 2px 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
.hint{color:var(--mute);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* pasos */
.steps{display:flex;gap:6px;margin:2px 2px 6px}.steps i{flex:1;height:4px;border-radius:2px;background:#ddd8cf}.steps i.on{background:var(--pink)}
.stepT{font-size:12.5px;color:var(--mute);font-weight:700;margin:0 2px;text-transform:uppercase;letter-spacing:.06em}
/* locales */
.loc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--ink)}
.loc .ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}.loc .ic svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.loc b{display:block;font-size:16px}.loc small{color:var(--mute)}.loc.on{border-color:var(--pink);background:var(--soft)}.loc .ck{margin-left:auto}
/* servicios */
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:650;color:var(--ink);white-space:nowrap}.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sv{display:flex;gap:12px;align-items:center;padding:13px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;margin:0 0 8px;font-weight:400;cursor:pointer}
.sv input{position:absolute;opacity:0;pointer-events:none}
.sv .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #cfcac2;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900}
.sv.on{border-color:var(--pink);background:var(--soft)}.sv.on .ck{background:var(--pink);border-color:var(--pink)}
.sv .n{flex:1;font-weight:600;line-height:1.25}.sv .m{color:var(--mute);font-size:13px;white-space:nowrap;text-align:right}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #cfcac2;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900}.on>.ck{background:var(--pink);border-color:var(--pink)}
/* cuándo */
.who{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.who::-webkit-scrollbar{display:none}
.wh{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;border:0;background:none;color:var(--ink);font-size:13px;font-weight:650}
.wh .av{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:19px;font-weight:800}
.wh.on .av{border-color:var(--pink);background:var(--pink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;scroll-snap-type:x proximity}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;width:64px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.chip small{font-size:11.5px;color:var(--mute);font-weight:700;text-transform:capitalize}.chip b{font-size:21px;line-height:1.1}.chip em{font-style:normal;font-size:10.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on small,.chip.on em{color:#ddd}
.chip.off{background:transparent;border-style:dashed;color:#b3ada4}.chip.off small,.chip.off em{color:#b3ada4}
.month{font-weight:800;font-size:15px;margin:4px 2px 8px}
.part{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--mute);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.06em}.part svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 0;font-size:15px;font-weight:700;color:var(--ink)}.slot.on{background:var(--pink);border-color:var(--pink);color:#fff}

label{display:block;font-weight:650;font-size:14px;margin:12px 2px 6px}

input:focus,textarea:focus{border-color:var(--pink)}
textarea{min-height:76px;resize:vertical}
.resume{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}.resume span{color:var(--mute)}.resume b{font-weight:650}
button.p{border:0;background:var(--pink);color:#fff;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:750;width:100%}
button.p:disabled{opacity:.45}
button.s{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:650}
button.s.bad{color:var(--bad)}
button.lnk{border:0;background:none;color:var(--mute);font-size:14px;font-weight:650;padding:8px 2px}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:750;background:#eee;color:#555}
.tag.ok{background:#e4f6ea;color:var(--ok)}.tag.warn{background:#fff1d6;color:var(--warn)}.tag.bad{background:#fde7e7;color:var(--bad)}.tag.info{background:#e4eefc;color:#1d5fb4}
.msg{border-radius:14px;padding:11px 13px;margin:8px 0;font-size:14px;background:#eef2fb;color:#1d3a6b}
.msg.warn{background:#fff6e0;color:#6b4a00}.msg.bad{background:#fde7e7;color:#8a1c1c}.msg.ok{background:#e4f6ea;color:#14532d}
.sum{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:8;display:flex;gap:10px;align-items:center;max-width:560px;margin:0 auto;padding:10px 14px}
.sum .in{flex:1;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 8px 24px rgba(17,17,19,.25)}
.sum b{flex:1;font-size:14px;line-height:1.25}.sum button.p{width:auto;padding:12px 18px}
.sum button.bk{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:12px 12px;font-size:15px;font-weight:700}
.photo{max-width:100%;max-height:200px;border-radius:12px;display:block;margin-top:8px}
.big{font-size:19px;font-weight:800;letter-spacing:-.01em}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:14px 2px}.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--pink);flex:none}
.full{text-align:center;padding:24px 16px}.full .ic{font-size:40px;line-height:1}.full h2{font-size:19px;margin:10px 0 6px}
a.tel{display:block;margin-top:14px;text-decoration:none;text-align:center;border-radius:14px;padding:14px 18px;background:var(--pink);color:#fff;font-size:17px;font-weight:750}

.titleRow{display:flex;align-items:center;gap:8px;margin:2px 0 4px}.titleRow h1{margin:4px 0}
.refresh{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink)}.refresh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.refresh.spin svg{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loc.off{opacity:.5}.loc:disabled{cursor:default}
.ap{display:flex;gap:12px;align-items:flex-start}.ap .d{flex:none;width:52px;border-radius:14px;background:var(--bg);text-align:center;padding:6px 0}.ap .d small{display:block;font-size:11px;font-weight:800;color:var(--pink);text-transform:uppercase}.ap .d b{display:block;font-size:20px;line-height:1.1}.ap .x{flex:1;min-width:0}
</style>

    }
    if (S.mine.length) { parts.push(el('h3', { text: 'Pedidas desde este móvil' })); S.mine.forEach(function (m) { parts.push(mineCard(m)); }); }
    if (centro.length) { parts.push(el('h3', { text: 'En el centro' })); centro.forEach(function (x) { parts.push(el('div', { class: 'card' }, [el('div', { class: 'ap' }, [dateBadge(x.d), el('div', { class: 'x' }, [el('b', { text: (x.sv || []).join(' + ') || 'Cita' }), el('div', { class: 'hint', text: dayText(x.d, true) + ' · ' + x.s + '–' + x.e + (x.emp ? ' con ' + x.emp : '') + (x.l ? ' · ' + x.l : '') })])])])); }); }
    return parts;
  }
  // (4.5.1) «Perfil»: «Tus citas en el centro» con el teléfono y el código que le dan en el centro (y olvidarlo en este móvil).
  function perfil() {
    var parts = [el('h1', { text: 'Perfil' }), el('p', { class: 'lead', text: 'Si ya eres clienta, con tu teléfono y el código que te damos en el centro ves aquí y en «Mis citas» todas tus próximas citas.' })];
    var c = store('cli'), box = el('div', { class: 'card', id: 'centro' });
    if (!c) {
      var ph = el('input', { type: 'tel', maxlength: 16, autocomplete: 'tel', placeholder: 'Tu teléfono' }), cd = el('input', { type: 'text', maxlength: 9, autocapitalize: 'characters', autocomplete: 'off', placeholder: 'Tu código (8 letras y números)' });
      box.appendChild(el('h2', { text: 'Tus citas en el centro' })); box.appendChild(el('label', { text: 'Teléfono' })); box.appendChild(ph); box.appendChild(el('label', { text: 'Código' })); box.appendChild(cd);
      box.appendChild(el('button', { class: 'p', type: 'button', style: 'margin-top:12px', disabled: S.clBusy ? true : null, text: S.clBusy ? 'Mirando…' : 'Ver mis citas', onclick: function () { if (digits(ph.value).length < 9 || codeNorm(cd.value).length !== 8) { S.clMsg = 'Escribe tu teléfono y el código de 8 letras y números.'; return render(); } store('cli', { p: ph.value, c: codeNorm(cd.value) }); showClient(); } }));
      box.appendChild(el('div', { class: 'hint', style: 'margin-top:10px', text: '¿No tienes código? Pídelo en el centro: te lo mandamos por WhatsApp.' }));
    } else {
      if (S.clBusy) box.appendChild(el('div', { class: 'hint', text: 'Mirando tus citas…' }));
      else if (S.cl) {
        box.appendChild(el('h2', { text: 'Hola' + (S.cl.nombre ? ', ' + S.cl.nombre : '') }));
        if (!S.cl.citas.length) box.appendChild(el('div', { class: 'hint', text: 'No tienes citas próximas. ¡Pide una!' }));
        S.cl.citas.forEach(function (x) { box.appendChild(el('div', { class: 'ap', style: 'padding:10px 0;border-top:1px solid var(--line)' }, [dateBadge(x.d), el('div', { class: 'x' }, [el('b', { text: dayText(x.d, true) + ' · ' + x.s + '–' + x.e }), el('div', { class: 'hint', text: (x.sv || []).join(' + ') + (x.emp ? ' · con ' + x.emp : '') + (x.l ? ' · ' + x.l : '') })])])); });
        box.appendChild(el('div', { class: 'hint', style: 'margin-top:8px', text: 'Para cambiar o anular una cita del centro, escríbenos o llámanos.' }));
      }
      box.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [el('button', { class: 's', type: 'button', text: 'Actualizar', onclick: showClient }), el('button', { class: 'lnk', type: 'button', text: 'Olvidar mi código en este móvil', onclick: function () { store('cli', null); S.cl = null; S.clMsg = ''; render(); } })]));
    }
    if (S.clMsg) box.appendChild(msg(S.clMsg, 'bad')); parts.push(box);
    var tel = S.zdata && S.zdata.local && S.zdata.local.tel; if (tel) parts.push(el('a', { class: 'tel', href: 'tel:' + String(tel).replace(/[^\d+]/g, ''), text: 'Llamar al centro · ' + tel }));
    return parts;
  }
  function render() {
    var y = window.scrollY; root.textContent = ''; head(); nav();
    if (!link.k) { root.appendChild(el('div', { class: 'card empty' }, [el('h2', { text: 'Falta el enlace' }), el('div', { class: 'hint', text: 'Abre el enlace (o el QR) que te ha dado el centro.' })])); return; }
    if (S.loading) { root.appendChild(el('div', { class: 'hint', style: 'padding:20px 4px', text: 'Cargando…' })); return; }
    if (S.err && S.zdata) root.appendChild(msg(S.err, 'bad')); // (sin datos del centro, el error lo enseña «Pedir cita» con su salida)
    var parts = S.tab === 'pedir' ? pedir() : S.tab === 'perfil' ? perfil() : mis();
    if (S.tab === 'pedir' && !S.zdata && !S.err) parts = [el('div', { class: 'hint', style: 'padding:20px 4px', text: 'Cargando…' })];
    parts.forEach(function (p) { if (p) root.appendChild(p); });
    window.scrollTo(0, y);
  }

  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) { }
  render();
  if (link.k && link.z) loadLocal(link.z).then(function () { if (store('reqs') && store('reqs').length) loadMine(); if (store('cli')) showClient(); });
})();
</script>
